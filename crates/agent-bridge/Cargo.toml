[package]
name = "agent-bridge"
version = "0.1.0"
edition = "2021"

[dependencies]
slint = { version = "1.16.1", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-femtovg",
    "renderer-software",
    "accessibility",
    "image-default-formats",
] }
doc-core = { path = "../doc-core" }
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros"] }
roe-agent = { path = "../../../roe/roe-agent" }
roe-api = { path = "../../../roe/roe-api" }
dotenvy = "0.15"
rig-core = { version = "0.42.0", default-features = false, features = ["rustls"] }
rig-agent = { version = "0.42.0", default-features = false }
futures = { version = "0.3", default-features = false, features = ["std"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
